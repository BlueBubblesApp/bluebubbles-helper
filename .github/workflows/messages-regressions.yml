name: Messages helper regressions

on:
  pull_request:
    paths:
      - 'Messages/MacOS-11+/**'
      - '.github/workflows/messages-regressions.yml'
  push:
    paths:
      - 'Messages/MacOS-11+/**'
      - '.github/workflows/messages-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  messages:
    name: Messages safety (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-15
            architecture: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check runner architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Test protocol checker negative cases
        run: python3 -m unittest discover -s 'Messages/MacOS-11+/Tests' -p 'test_*.py'
      - name: Run actual-method Foundation fixtures
        run: python3 Messages/MacOS-11+/Tests/run_safety_tests.py
      - name: Build unsigned Messages dylib without installation
        run: >-
          xcodebuild -workspace 'Messages/MacOS-11+/BlueBubblesHelper.xcworkspace'
          -scheme 'BlueBubblesHelper DyLib' -configuration Release
          -arch '${{ matrix.architecture }}'
          -derivedDataPath "$RUNNER_TEMP/messages-derived"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Check built architecture and portable dylib identity
        run: |
          dylib="$RUNNER_TEMP/messages-derived/Build/Products/Release/BlueBubblesHelper.dylib"
          xcrun lipo "$dylib" -verify_arch '${{ matrix.architecture }}'
          test "$(otool -D "$dylib" | tail -n 1)" = '@rpath/BlueBubblesHelper.dylib'
      - name: Read pinned official Server protocol source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: BlueBubblesApp/bluebubbles-server
          ref: e2a5bf6e624dd03d4a98334824bc30880c69407a
          path: .protocol-server
          persist-credentials: false
      - name: Check Messages action name coverage
        run: python3 Messages/MacOS-11+/Tests/check_server_protocol.py --server-root .protocol-server
